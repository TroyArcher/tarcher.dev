baseURL: https://tarcher.dev/
languageCode: en-us
title: Troy Archer
theme: ["PaperMod"]

pagination:
  pagerSize: 5
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: false
pygmentsUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Blog
          url: /
          weight: 10
        - name: Portfolio
          url: /portfolio/
          weight: 20
        - name: Tags
          url: /tags/
          weight: 30
        - name: Search
          url: /search/
          weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: Troy Archer - Senior Software Engineer
  description: "Senior Software Engineer portfolio and technical blog focusing on distributed systems and telecommunications platform architecture."
  keywords: [Software Engineer, Distributed Systems, Telecommunications, Cloud Architecture, Microservices]
  author: Troy Archer
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true

  label:
    text: "Troy Archer"
    icon: /apple-touch-icon.png
    iconHeight: 35

  homeInfoParams:
    Title: "Troy Archer"
    Content: "Senior Software Engineer specializing in distributed systems, high-throughput microservices, and telecommunications architecture."

  socialIcons:
    - name: github
      url: "https://github.com/TroyArcher"
    - name: linkedin
      url: "https://www.linkedin.com/in/troyharcher/"
    - name: email
      url: "mailto:tarcherdev@gmail.com"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/TroyArcher/tarcher.dev/tree/main/content/posts/"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

privacy:
  vimeo:
    disabled: false
    simple: true

  x:
    disabled: false
    enableDNT: true
    simple: true

  instagram:
    disabled: false
    simple: true

  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true